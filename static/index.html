<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Asesor de Viajes</title>
  <style>
    :root {
      --bg: #f4f5f7; --panel: #ffffff; --text: #1d2330; --muted: #6b7280;
      --border: #e3e6eb; --accent: #2563eb; --accent-text: #ffffff;
      --bot: #eef1f5; --tool: #fff4e0; --tool-text: #8a5a00;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #11141a; --panel: #1a1f27; --text: #e6e9ef; --muted: #9aa3b2;
        --border: #2a313c; --accent: #3b82f6; --accent-text: #ffffff;
        --bot: #232a35; --tool: #3a2e12; --tool-text: #f3c86b;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; background: var(--bg); color: var(--text);
      font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      display: flex; justify-content: center; min-height: 100vh; padding: 16px;
    }
    .app {
      width: 100%; max-width: 720px; background: var(--panel);
      border: 1px solid var(--border); border-radius: 14px;
      display: flex; flex-direction: column; height: calc(100vh - 32px);
    }
    header {
      padding: 14px 18px; border-bottom: 1px solid var(--border);
      display: flex; align-items: center; justify-content: space-between; gap: 12px;
    }
    header h1 { font-size: 16px; margin: 0; }
    header p { margin: 2px 0 0; color: var(--muted); font-size: 13px; }
    .badge {
      font-size: 12px; padding: 3px 10px; border-radius: 999px;
      border: 1px solid var(--border); color: var(--muted); white-space: nowrap;
    }
    #log { flex: 1; overflow-y: auto; padding: 18px; display: flex; flex-direction: column; gap: 10px; }
    .msg { max-width: 85%; padding: 10px 14px; border-radius: 12px; white-space: pre-wrap; }
    .user { align-self: flex-end; background: var(--accent); color: var(--accent-text); }
    .bot { align-self: flex-start; background: var(--bot); }
    .tool {
      align-self: flex-start; font-size: 12px; padding: 3px 10px;
      background: var(--tool); color: var(--tool-text); border-radius: 8px;
    }
    form { display: flex; gap: 8px; padding: 12px; border-top: 1px solid var(--border); }
    input {
      flex: 1; padding: 11px 14px; border-radius: 10px; border: 1px solid var(--border);
      background: var(--bg); color: var(--text); font: inherit;
    }
    button {
      padding: 0 18px; border: 0; border-radius: 10px; background: var(--accent);
      color: var(--accent-text); font: inherit; cursor: pointer;
    }
    button:disabled { opacity: .6; cursor: default; }
    .chips { display: flex; flex-wrap: wrap; gap: 6px; padding: 0 12px 12px; }
    .chips button {
      background: transparent; color: var(--muted); border: 1px solid var(--border);
      padding: 5px 10px; font-size: 13px;
    }
  </style>
</head>
<body>
  <div class="app">
    <header>
      <div>
        <h1>Rumbo Viajes · Asesora virtual</h1>
        <p>FastAPI + LangGraph + LangChain, desplegado en Render</p>
      </div>
      <span class="badge" id="mode">conectando…</span>
    </header>
    <div id="log"></div>
    <div class="chips">
      <button type="button">Hola</button>
      <button type="button">Me llamo Ana</button>
      <button type="button">Quiero un viaje de playa</button>
      <button type="button">¿Cuánto cuesta Cancún?</button>
      <button type="button">¿Qué requisitos necesito?</button>
      <button type="button">¿Cómo me llamo?</button>
    </div>
    <form id="form">
      <input id="input" placeholder="Escribe un mensaje…" autocomplete="off">
      <button id="send">Enviar</button>
    </form>
  </div>
  <script>
    const log = document.getElementById("log");
    const input = document.getElementById("input");
    const send = document.getElementById("send");
    const modeBadge = document.getElementById("mode");
    let threadId = null;

    function add(text, cls) {
      const div = document.createElement("div");
      div.className = "msg " + cls;
      div.textContent = text;
      log.appendChild(div);
      log.scrollTop = log.scrollHeight;
    }

    async function ask(text) {
      if (!text.trim()) return;
      add(text, "user");
      input.value = "";
      send.disabled = true;
      try {
        const res = await fetch("/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ message: text, thread_id: threadId })
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.detail || res.status);
        threadId = data.thread_id;
        data.tools_used.forEach(t => {
          const tag = document.createElement("div");
          tag.className = "tool";
          tag.textContent = "🔧 tool: " + t;
          log.appendChild(tag);
        });
        add(data.reply, "bot");
      } catch (err) {
        add("Error: " + err.message, "bot");
      } finally {
        send.disabled = false;
        input.focus();
      }
    }

    document.getElementById("form").addEventListener("submit", e => { e.preventDefault(); ask(input.value); });
    document.querySelectorAll(".chips button").forEach(b => b.addEventListener("click", () => ask(b.textContent)));

    fetch("/health").then(r => r.json()).then(d => {
      modeBadge.textContent = "modo: " + d.mode + " · v" + d.version;
    }).catch(() => { modeBadge.textContent = "sin conexión"; });
  </script>
</body>
</html>
